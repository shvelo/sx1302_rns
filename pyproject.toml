[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sx1302-reticulum"
version = "0.1.0"
description = "In-process Reticulum interface for SX1302 LoRa concentrators"
requires-python = ">=3.9"
dependencies = ["rns>=1.5.7,<2"]

[tool.setuptools.packages.find]
include = ["sx1302_reticulum*"]

[tool.setuptools.package-data]
sx1302_reticulum = ["libloragw.so"]

[project.scripts]
sx1302-ctl = "sx1302_reticulum.ctl:main"

[tool.pytest.ini_options]
testpaths = ["tests"]