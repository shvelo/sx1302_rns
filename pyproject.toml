[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sx1302-reticulum"
version = "0.1.0"
description = "In-process Reticulum interface for SX1302 LoRa concentrators"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["rns>=1.5.7,<1.6"]

[tool.setuptools.packages.find]
include = ["sx1302_reticulum*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
