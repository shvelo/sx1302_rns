name: Build Python Wheel

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build tools
        run: |
          python -m pip install --break-system-packages build wheel

      - name: Build HAL shared library
        run: |
          chmod +x ./scripts/build_hal.sh
          ./scripts/build_hal.sh

      - name: Install HAL library into package
        run: |
          cp build/libloragw.so sx1302_reticulum/libloragw.so

      - name: Build wheel
        run: |
          python -m build --wheel --outdir /tmp/wheelhouse .

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: sx1302-reticulum-wheel
          path: /tmp/wheelhouse/*.whl
          archive: false