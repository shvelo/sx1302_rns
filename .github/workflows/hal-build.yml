name: Build HAL

on:
  push:
    branches: [feature/reticulum-sx1302-interface]
  pull_request:
    branches: [feature/reticulum-sx1302-interface]

jobs:
  build-hal:
    if: github.event_name == 'push' && contains(github.ref, 'feature/reticulum-sx1302-interface')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel

      - name: Build HAL shared library
        run: |
          # This assumes we're on a Raspberry Pi with the build tools
          # On non-PI runners, this will be skipped
          chmod +x ./scripts/build_hal.sh
          ./scripts/build_hal.sh

      - name: Verify HAL library
        run: |
          if [ -f build/libloragw.so ]; then
            echo "✓ HAL library built successfully"
            ls -la build/libloragw.so
          else
            echo "✗ HAL library not found - build may have failed or this is not a Pi"
          fi