name: Build HAL

on:
  push:
  pull_request:

jobs:
  build-hal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build dependencies
        run: |
          python -m pip install --break-system-packages setuptools wheel

      - name: Build HAL shared library
        run: |
          chmod +x ./scripts/build_hal.sh
          ./scripts/build_hal.sh

      - name: Verify HAL library
        run: |
          if [ -f build/libloragw.so ]; then
            echo "✓ HAL library built successfully"
            ls -la build/libloragw.so
          else
            echo "✗ HAL library not found"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: sx1302-reticulum-hal
          path: build/libloragw.so
          archive: false