name: Build Raspberry Pi Wheel

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-pi-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install ARM cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf

      - name: Install build dependencies
        run: |
          python -m pip install --break-system-packages setuptools wheel build

      - name: Build HAL for Raspberry Pi (ARM)
        run: |
          chmod +x ./scripts/build_hal.sh
          SKIP_ABI_CHECK=1 CC=arm-linux-gnueabihf-gcc CROSS_COMPILE=arm-linux-gnueabihf- ./scripts/build_hal.sh

      - name: Verify ARM architecture
        run: |
          file build/libloragw.so
          echo "Expected: ELF 32-bit LSB shared object, ARM, EABI5"

      - name: Install HAL library into package
        run: |
          cp build/libloragw.so sx1302_reticulum/libloragw.so
          ls -la sx1302_reticulum/libloragw.so

      - name: Build wheel
        run: |
          python -m build --wheel --outdir /tmp/wheelhouse .

      - name: Verify wheel contents
        run: |
          python -m zipfile --list /tmp/wheelhouse/*.whl | grep -E "libloragw.so|\.py$"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          name: sx1302-reticulum-pi-wheel
          path: /tmp/wheelhouse/*.whl