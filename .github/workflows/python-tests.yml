name: Python Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --break-system-packages pytest setuptools wheel

      - name: Install package in development mode
        run: |
          pip install --break-system-packages -e .

      - name: Run unit tests
        run: |
          python -m pytest -v

      - name: Verify package files
        run: |
          # Check that the package includes the HAL library
          ls -la sx1302_reticulum/libloragw.so 2>/dev/null || echo "HAL .so not in source tree (expected for source checkout)"