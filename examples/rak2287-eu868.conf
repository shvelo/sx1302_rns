# RAK2287 (SX1302 + SX1250) on a Raspberry Pi carrier, EU868.
#
# This is a single-channel raw LoRa profile for Reticulum, not a LoRaWAN
# gateway channel plan. Adjust the frequency, SF and reset GPIO for your
# carrier if needed.
#
# The reset script defaults to GPIO 17, which is the reset line on most RAK2287
# Pi HATs. RAK2004 Pi HAT Ver B (and some Helium miner carriers) route it to
# GPIO 25. Override SX1302_RESET_GPIO in the environment when using one of those.

[board]
spi_path = /dev/spidev0.0
radio_type = SX1250
clksrc = 0
full_duplex = no
single_input_mode = no
rssi_offset = -215.4
rssi_tcomp_a = 0.0
rssi_tcomp_b = 0.0
rssi_tcomp_c = 20.41
rssi_tcomp_d = 2162.56
rssi_tcomp_e = 0.0
reset_script = ../scripts/reset_rak2287.sh
reset_start_args = start
reset_stop_args = stop
reset_enabled = yes

[rf]
chain = 0
frequency = 868100000
tx_enable = yes
tx_power = 14

[channel]
# service = LoRa service channel (IF chain 8), supports 125/250/500 kHz
# multi_sf = one 125 kHz spreading factor on IF chain 0
mode = service
if_frequency = 0
bandwidth = 125000
spreadingfactor = 9
codingrate = 5
preamble = 8

# RAK2287 EU868 TX gain table. Values come from the RAK gateway configuration
# for this module. Keep entries sorted by ascending rf_power.
[txgain.12]
rf_power = 12
pa_gain = 1
pwr_idx = 4

