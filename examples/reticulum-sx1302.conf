# Reticulum interface stanza for the SX1302 raw-LoRa interface.
#
# Add the [[SX1302 LoRa]] section under the [interfaces] section of your
# Reticulum configuration. The board profile is required; relative paths are
# resolved from the Reticulum configuration directory.

[interfaces]

  [[SX1302 LoRa]]
    type = SX1302
    enabled = yes

    # Board profile with SPI, reset, RF chain, TX gain LUT and channel defaults.
    board_profile = /path/to/sx1302_hal/examples/rak2287-eu868.conf

    # Optional overrides for values in the board profile.
    # frequency = 868100000
    # bandwidth = 125000
    # spreadingfactor = 9
    # codingrate = 5
    # txpower = 14
    # preamble = 8
    # spi_path = /dev/spidev0.0
    # channel_mode = service

    # Reset handling. reset_gpio comes from the board profile unless overridden.
    # reset_enabled = yes
    # reset_gpio = 25
    # reset_script = /path/to/sx1302_hal/scripts/reset_rak2287.sh
    # reset = no

    # Shared HAL library. Defaults to $SX1302_HAL_LIB, build/libloragw.so, or
    # the system libloragw.
    # library = /path/to/sx1302_hal/build/libloragw.so

    # Radio worker tuning (defaults shown).
    # queue_size = 16
    # rx_batch = 8
    # rx_idle_sleep = 0.01
    # status_poll = 0.005
    # tx_free_timeout = 5.0
    # tx_complete_margin = 2.0
    # stop_timeout = 10.0

    # Optional airtime and channel-access controls (disabled by default).
    # duty_cycle_percent = 1
    # duty_cycle_window = 3600
    # lbt_rssi_threshold = -90
    # lbt_check_ms = 50
    # lbt_timeout = 5
